<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" fill="none" role="img" aria-label="Modern house with pool at dusk">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B45309"/>
      <stop offset="1" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BAE6FD" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- warm light halo -->
  <ellipse cx="450" cy="340" rx="430" ry="250" fill="url(#halo)"/>

  <!-- trees behind the house -->
  <g>
    <rect x="62" y="430" width="10" height="90" fill="#422006"/>
    <circle cx="68" cy="395" r="64" fill="#166534"/>
    <circle cx="30" cy="450" r="48" fill="#14532D"/>
    <circle cx="115" cy="355" r="40" fill="#15803D"/>

    <rect x="846" y="430" width="10" height="90" fill="#422006"/>
    <circle cx="842" cy="400" r="60" fill="#166534"/>
    <circle cx="880" cy="455" r="46" fill="#14532D"/>
    <circle cx="796" cy="365" r="38" fill="#15803D"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="450" cy="522" rx="390" ry="12" fill="#000" fill-opacity="0.25"/>

  <!-- lower volume -->
  <rect x="90" y="330" width="720" height="190" rx="3" fill="url(#wall)"/>
  <rect x="70" y="316" width="760" height="16" rx="2" fill="#334155"/>

  <!-- upper volume -->
  <rect x="210" y="160" width="500" height="156" fill="url(#wall)"/>
  <rect x="190" y="146" width="540" height="16" rx="2" fill="#1E293B"/>

  <!-- wood panel -->
  <rect x="210" y="162" width="110" height="154" fill="url(#wood)"/>
  <g stroke="#451A03" stroke-opacity="0.4" stroke-width="2">
    <line x1="232" y1="162" x2="232" y2="316"/>
    <line x1="254" y1="162" x2="254" y2="316"/>
    <line x1="276" y1="162" x2="276" y2="316"/>
    <line x1="298" y1="162" x2="298" y2="316"/>
  </g>

  <!-- upper glass windows (lit) -->
  <rect x="340" y="186" width="350" height="82" fill="url(#glow)"/>
  <g stroke="#92400E" stroke-opacity="0.55" stroke-width="3">
    <line x1="398" y1="186" x2="398" y2="268"/>
    <line x1="457" y1="186" x2="457" y2="268"/>
    <line x1="515" y1="186" x2="515" y2="268"/>
    <line x1="573" y1="186" x2="573" y2="268"/>
    <line x1="632" y1="186" x2="632" y2="268"/>
  </g>
  <rect x="420" y="236" width="70" height="32" rx="8" fill="#7C2D12" fill-opacity="0.35"/>
  <circle cx="600" cy="214" r="9" fill="#FFFBEB" fill-opacity="0.9"/>

  <!-- balcony glass railing -->
  <rect x="330" y="274" width="380" height="42" fill="url(#glass)" stroke="#E0F2FE" stroke-opacity="0.8"/>
  <g stroke="#E0F2FE" stroke-opacity="0.55">
    <line x1="368" y1="274" x2="368" y2="316"/>
    <line x1="406" y1="274" x2="406" y2="316"/>
    <line x1="444" y1="274" x2="444" y2="316"/>
    <line x1="482" y1="274" x2="482" y2="316"/>
    <line x1="520" y1="274" x2="520" y2="316"/>
    <line x1="558" y1="274" x2="558" y2="316"/>
    <line x1="596" y1="274" x2="596" y2="316"/>
    <line x1="634" y1="274" x2="634" y2="316"/>
    <line x1="672" y1="274" x2="672" y2="316"/>
  </g>
  <line x1="330" y1="274" x2="710" y2="274" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.9"/>

  <!-- lower windows (lit) -->
  <rect x="120" y="358" width="190" height="140" fill="url(#glow)"/>
  <g stroke="#92400E" stroke-opacity="0.55" stroke-width="3">
    <line x1="183" y1="358" x2="183" y2="498"/>
    <line x1="247" y1="358" x2="247" y2="498"/>
  </g>

  <rect x="440" y="358" width="330" height="140" fill="url(#glow)"/>
  <g stroke="#92400E" stroke-opacity="0.55" stroke-width="3">
    <line x1="495" y1="358" x2="495" y2="498"/>
    <line x1="550" y1="358" x2="550" y2="498"/>
    <line x1="605" y1="358" x2="605" y2="498"/>
    <line x1="660" y1="358" x2="660" y2="498"/>
    <line x1="715" y1="358" x2="715" y2="498"/>
  </g>
  <rect x="462" y="450" width="96" height="34" rx="10" fill="#7C2D12" fill-opacity="0.35"/>
  <rect x="640" y="462" width="60" height="22" rx="6" fill="#7C2D12" fill-opacity="0.3"/>
  <circle cx="598" cy="404" r="10" fill="#FFFBEB" fill-opacity="0.9"/>

  <!-- entrance door -->
  <rect x="332" y="358" width="78" height="140" rx="2" fill="#0F172A"/>
  <rect x="338" y="364" width="66" height="128" rx="1" fill="#1E293B"/>
  <circle cx="396" cy="430" r="3" fill="#FDE68A"/>
  <circle cx="371" cy="344" r="4" fill="#FDE68A"/>

  <!-- pool -->
  <rect x="84" y="514" width="732" height="8" rx="2" fill="#E2E8F0"/>
  <rect x="90" y="522" width="720" height="72" rx="6" fill="url(#pool)"/>
  <rect x="120" y="522" width="190" height="62" fill="url(#reflect)"/>
  <rect x="440" y="522" width="330" height="62" fill="url(#reflect)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round">
    <line x1="140" y1="548" x2="260" y2="548"/>
    <line x1="460" y1="556" x2="620" y2="556"/>
    <line x1="680" y1="542" x2="760" y2="542"/>
    <line x1="330" y1="570" x2="430" y2="570"/>
  </g>

  <!-- shrubs -->
  <g fill="#14532D">
    <ellipse cx="108" cy="514" rx="34" ry="16"/>
    <ellipse cx="150" cy="518" rx="26" ry="12" fill="#166534"/>
    <ellipse cx="792" cy="514" rx="34" ry="16"/>
    <ellipse cx="750" cy="518" rx="26" ry="12" fill="#166534"/>
  </g>
</svg>